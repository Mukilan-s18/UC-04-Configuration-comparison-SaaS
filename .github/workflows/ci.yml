name: CI — ConfigGuard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests & Acceptance Suite (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run unit & acceptance tests (A01 - A12)
        run: go test -v -race ./...

      - name: Run automated acceptance verification harness
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

  code-quality:
    name: Code Quality & Static Analysis (go vet & gofmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Verify Code Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not formatted properly:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "All Go files formatted correctly."

      - name: Run Go Vet Static Analysis
        run: go vet ./...

  benchmarks:
    name: High-Throughput Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Run High-Throughput Benchmarks
        run: go test -v -bench=. -run=^$ ./tests

  terraform-validate:
    name: Terraform fmt + validate (IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: cd infra && terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate

  docker-build:
    name: Build Docker Container (Alpine)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Compile Server Binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o bin/saas-server ./cmd/server
          ls -lh bin/saas-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: configguard:ci-test

  security-audit:
    name: Security & Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'
          check-latest: true

      - name: Verify module checksums
        run: go mod verify

      - name: Check for unexpected dependency drift
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  frontend-check:
    name: Frontend & Web Assets Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Web Dashboard Templates & Assets
        run: |
          test -s web/index.html || { echo "web/index.html is missing or empty"; exit 1; }
          test -s web/templates/app.html || { echo "web/templates/app.html is missing or empty"; exit 1; }
          grep -q "session-select-dropdown" web/index.html || { echo "Missing session dropdown in UI"; exit 1; }
          grep -q "btn-submit-run" web/index.html || { echo "Missing run submit button in UI"; exit 1; }
          grep -q "Load Valid" web/index.html || { echo "Missing valid fixture loader in UI"; exit 1; }
          echo "Web dashboard and template assets validated successfully."

  script-lint:
    name: Automation Scripts Syntax & Linting (bash)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Syntax Check All Shell Scripts
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/verify.sh
          bash -n scripts/cleanup.sh
          echo "All deployment and verification scripts passed bash syntax verification."

  documentation-audit:
    name: Documentation & Evidence Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Audit Required Deliverables and Proof Assets
        run: |
          test -s README.md || { echo "README.md missing or empty"; exit 1; }
          test -s LICENSE || { echo "LICENSE missing or empty"; exit 1; }
          test -s docs/AZURE_LIVE_RUNBOOK_AND_PROOF.md || { echo "AZURE_LIVE_RUNBOOK_AND_PROOF.md missing or empty"; exit 1; }
          test -s docs/AZURE_LIVE_RUNBOOK_AND_PROOF.html || { echo "AZURE_LIVE_RUNBOOK_AND_PROOF.html missing or empty"; exit 1; }
          test -s docs/AZURE_LIVE_RUNBOOK_AND_PROOF.pdf || { echo "AZURE_LIVE_RUNBOOK_AND_PROOF.pdf missing or empty"; exit 1; }
          test -s docs/screenshots/azure_live_page.png || { echo "azure_live_page.png screenshot missing"; exit 1; }
          test -s docs/screenshots/azure_live_diff.png || { echo "azure_live_diff.png screenshot missing"; exit 1; }
          test -s evidence/acceptance_report.md || { echo "acceptance_report.md missing or empty"; exit 1; }
          test -s evidence/aife_record.md || { echo "aife_record.md missing or empty"; exit 1; }
          test -s skills/configuration-compare/SKILL.md || { echo "SKILL.md missing or empty"; exit 1; }
          echo "All 10 project deliverables and audit records verified."

  schema-migration-check:
    name: Database Schema & Migration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify DDL Migrations
        run: |
          test -s migrations/000001_create_saas_contract_schema.up.sql || { echo "Up migration missing"; exit 1; }
          test -s migrations/000001_create_saas_contract_schema.down.sql || { echo "Down migration missing"; exit 1; }
          grep -q "CREATE TABLE IF NOT EXISTS runs" migrations/000001_create_saas_contract_schema.up.sql || { echo "Missing runs DDL"; exit 1; }
          grep -q "CREATE TABLE IF NOT EXISTS daily_usage" migrations/000001_create_saas_contract_schema.up.sql || { echo "Missing daily_usage DDL"; exit 1; }
          echo "Database schema migrations validated successfully."
